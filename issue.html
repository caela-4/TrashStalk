        .container {
            max-width: 1000px;

        }

        p {
            margin-bottom: 17px;
            text-align: justify;
            font-size: 15px;
        }

        .label {
            display: inline-block;
            background: #FFE5C2;
            color: #A94E00;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .fact {
            background: #FFF8EF;
            border-left: 6px solid #FD9D24;
            padding: 22px;
            margin: 20px 0;
            border-radius: 12px;
            transition: 0.3s;
        }

        .fact:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(253, 157, 36, 0.15);
        }

        .fact h3 {
            color: #D96F0B;
            margin-bottom: 10px;
        }

        .fact p {
            margin-bottom: 0;
        }

        .highlight {
            color: #D96F0B;
            font-weight: bold;
        }

            border-bottom: none;

        .footer-frame {
            width: 100%;
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .nav-pill {
            display: inline-block;
            background: #FFF4E7;
            color: #713B1C;
            text-decoration: none;
            border: 1px solid #713B1C;
            border-radius: 11px;
            padding: 10px 18px;
            font-size: 11px;
            transition: 0.3s ease;
        }

        .nav-pill:hover {
            background: #713B1C;
            color: white;
            transform: translateY(-2px);
        }

        .nav-pill.active {
            background: #FFF4E7;
            color: #713B1C;
        }

        .footer-frame::after {
            content: "";
            display: block;
            width: 65%;
            border-top: 1px solid #D98C2B;
            margin: 16px auto 10px;
        }

        .footer-note {
            color: #713B1C;
            font-size: 10px;

            margin: 0;

        @media (max-width: 600px) {

            body {

            .container {
                padding: 20px;
            }

            header h1 {

            }

            header h2 {
                font-size: 19px;
            }

            .footer-nav {
                gap: 10px;
            }

            .nav-pill {
                font-size: 10px;
                padding: 10px 12px;
            }

            .footer-frame::after {
